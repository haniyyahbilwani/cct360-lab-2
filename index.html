<!DOCTYPE html>
<html>
<head>
    <title>My Interactive Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="page">

    <h1 id="title">Good Morning!</h1>
    <p id="message">Click a button, press a key, or move your mouse.</p>

    <button onclick="changeToNight()">Night</button>
    <button onclick="changeToDay()">Day</button>

    <div id="box"></div>

    <p id="mouse">Mouse position will show here</p>
    <p id="size">Resize the window to see its width</p>

    <script src="script.js"></script>
</body>
</html>
